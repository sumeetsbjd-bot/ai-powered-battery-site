<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="#0a0e27"/>
  <rect x="10" y="10" width="180" height="180" rx="32" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.3"/>
  <!-- Battery body -->
  <rect x="55" y="60" width="90" height="100" rx="12" fill="url(#grad)"/>
  <!-- Battery terminal -->
  <rect x="80" y="45" width="40" height="20" rx="6" fill="url(#grad)"/>
  <!-- Lightning bolt -->
  <path d="M110 80 L90 110 L105 110 L90 140 L120 105 L105 105 L115 80Z" fill="#0a0e27" stroke="#0a0e27" stroke-width="2" stroke-linejoin="round"/>
</svg>
